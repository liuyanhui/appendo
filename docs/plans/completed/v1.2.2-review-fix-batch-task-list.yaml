# 参考: docs/architecture.md §4.4（K10 修法）、§11、§12
# ==============================================================================
# Field Definitions:
#   id:                 Unique, STABLE identifier (label only — does NOT encode order)
#   seq:                Execution order, unquoted number. Orchestrator picks smallest pending seq.
#   description:       What to do — specific, verb-led
#   constraints:       Scope limits — files/modules/boundaries
#   deliverable:       Concrete output artifacts
#   evaluation_criteria: yes/no verifiable conditions
#   evaluation_method: "{method} [read-only | requires-execution]"
#   evaluation_result: [filled by orchestrator]
#   current_round:     [incremented by orchestrator]
#   max_retries:       3 simple, 5 complex
#   status:            pending → in-progress → evaluating → passed | failed | blocked
#   dependencies:      LIST of Task-IDs; [] for none
# ==============================================================================

