    constraints: "仅改 Appendo/src/main/java/com/yiyue31/android/appendo/util/EntryParser.kt（如方案要求则含 stripIsolationMarkers）与 Appendo/src/test/java/.../util/EntryParserTest.kt；严格按 T-d15b 确认稿执行，越出方案范围的改动不做"
