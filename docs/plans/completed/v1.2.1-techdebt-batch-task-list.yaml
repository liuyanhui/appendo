  # ---------- TD-014（中-高）应用更新丢闹钟 ----------

  - id: T-d14
    seq: 6
    description: "补齐应用更新后的闹钟恢复：AndroidManifest 中 ReminderBootReceiver 的 intent-filter 增加 MY_PACKAGE_REPLACED；MainScreen 启动时对 sidecar 中未 fired 的提醒按 effectiveTrigger 重排闹钟（覆盖 force-stop 后自愈）；修正 ReminderBootReceiver 与事实不符的 KDoc"
    constraints: "仅改 AndroidManifest.xml、reminder/ReminderBootReceiver.kt（KDoc）、ui/MainScreen.kt（启动重排）；重排逻辑尽量复用 ReminderLogic 既有纯函数；新增纯逻辑必须有单测"
    deliverable: "manifest 变更 + 启动重排逻辑 + ReminderLogicTest（或新增纯函数测试）+ KDoc 修正"
    evaluation_criteria:
      - "ReminderBootReceiver 的 intent-filter 同时含 BOOT_COMPLETED 与 MY_PACKAGE_REPLACED"
      - "应用启动路径会对 store 中未 fired 的提醒调用 AlarmScheduler.schedule，且该决策逻辑有纯函数单测覆盖"
      - "ReminderBootReceiver 的 KDoc 与实际触发条件一致（不残留不实声明）"
      - "./gradlew testDebugUnitTest 全部通过"
    evaluation_method: "automated-test [requires-execution]"
    evaluation_result: "passed-2026-08-31: manifest 含双 action；rescheduleAll 三入口共用（决策逻辑=ReminderLogic.bootDecide，已有纯函数单测）；KDoc 修正；suite 绿"
    current_round:
