# ==============================================================================
# 项目: appendo 技术债修复批次（TD-010 ~ TD-015）— v1.2.1 bugfix
# 目标: 修复 5 项缺陷 + 1 项优化，合并发版 v1.2.1；每项附回归测试；完成后同步文档
# 范围外: TD-007/TD-008（Phase B：parseMarkdownEntries 包装器、主线程 I/O 下放、ViewModel）
# 执行顺序依据: 风险优先级 TD-012 > TD-015 > TD-014 > TD-013 > TD-010 > TD-011（用户已确认）
# 卡点: T-d15b 产出方案后必须暂停等待用户确认，才可启动 T-d15c
# 参考: docs/plans/debt-tracker.md（TD-010~015）、docs/architecture.md §8.1/§11/§12
# ==============================================================================
# Field Definitions:
#   id:                 Unique, STABLE identifier (label only — does NOT encode order). e.g. T-d12a
#   seq:                Execution order, a number (integer or decimal). Orchestrator picks smallest pending seq.
#   description:       What to do — specific, actionable, starts with a verb
#   constraints:       Scope limits — which files, modules, or technical boundaries
#   deliverable:       Concrete output artifacts (can be multiple)
#   evaluation_criteria: List of yes/no verifiable conditions — NOT subjective like "works correctly"
#   evaluation_method: "{method} [read-only | requires-execution]" — manual | automated-test | code-review
#   evaluation_result:  [filled by orchestrator after each evaluation round]
#   current_round:      [incremented by orchestrator on each retry]
#   max_retries:        Max retries for the orchestrator. 3 simple, 5 complex
#   status:             [filled by orchestrator] pending → in-progress → evaluating → passed | failed | blocked
#   dependencies:       LIST of Task-IDs that must pass before this task starts; [] for none
# ==============================================================================

tasks:
  # ---------- TD-012（高）读失败=空串破坏链 ----------

  - id: T-d12a
    seq: 1
    description: "为读失败引入显式失败语义并在存储层加守卫：ReadResult 增加 failed 标志（或等价机制）；FileBasedMarkdownFile 与 SafMarkdownFile 的 initHeader 在读失败时不得覆写文件（返回 false），append/appendEntry 在读失败时中止并返回 false（不得进入 header+新条目的全量重写分支）；附纯 JVM 回归测试模拟读失败"
    constraints: "仅改 Appendo/src/main/java/com/yiyue31/android/appendo/util/ 下 ReadResult.kt、MarkdownFileOperations.kt、FileBasedMarkdownFile.kt、SafMarkdownFile.kt，及 Appendo/src/test/java/com/yiyue31/android/appendo/util/ 下对应测试；不改 ui/、reminder/、data/；不动 FileOperationLock 锁协议；模拟读失败可用「file 路径指向目录」等纯 JVM 手段（FileInputStream 对目录抛异常）"
    deliverable: "util/ReadResult.kt（含失败标志）+ 两实现类守卫代码 + FileBasedMarkdownFileTest 新增读失败回归用例（append 中止、initHeader 不覆写、failed 标志正确）"
    evaluation_criteria:
      - "读失败场景（file 路径为目录）下 append 返回 false，且目标未被写入 header+新条目内容"
      - "同场景 initHeader 返回 false 且未写入 FILE_HEADER"
      - "readAllWithStatus 对读失败返回 failed=true；对真空文件返回 failed=false"
      - "./gradlew testDebugUnitTest 全部通过（含既有用例无回归）"
    evaluation_method: "automated-test [requires-execution]"
    evaluation_result: "passed-2026-08-31: 109 tests green（5 个新读失败守卫用例全过）；附带 build.gradle.kts 开启 unitTests.isReturnDefaultValues（纯 JVM 下 Log 不抛异常），否则失败路径测试无法触达"
    current_round:
    max_retries: 5
    status: passed
    dependencies: []

  - id: T-d12b
    seq: 2
    description: "给 MainScreen.refreshEntryCount 的孤儿对账加守卫：读失败（failed）或「解析结果为空但上一次刷新非空」时跳过孤儿清理，防止瞬时读失败误删全部提醒；加注释引用 TD-012 与 architecture.md §4.4"
    constraints: "仅改 Appendo/src/main/java/com/yiyue31/android/appendo/ui/MainScreen.kt 的 refreshEntryCount；不改对账的正常路径行为；不改 ReminderStore/AlarmScheduler 接口"
    deliverable: "MainScreen.kt 中带守卫与注释的对账逻辑"
    evaluation_criteria:
      - "读失败路径上不会调用 AlarmScheduler.cancel 或 ReminderStore.remove（代码检查：守卫条件覆盖 failed 与「空但上轮非空」两种情况）"
      - "正常空文件（真无条目）时孤儿清理仍执行——原有行为不回归"
    evaluation_method: "code-review [read-only]"
    evaluation_result: "passed-2026-08-31: 守卫覆盖 failed 与「空但上轮非空」两条件（refreshEntryCount return@launch）；正常清空路径经 clear() 先置空 entries 不受影响；testDebugUnitTest 全绿"
    current_round:
    max_retries: 3
    status: passed
    dependencies: [T-d12a]

