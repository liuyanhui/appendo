org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Aliyun mirrors for faster downloads in China
systemProp.https.proxyHost=
systemProp.https.proxyPort=
aliyunMaven=https://maven.aliyun.com/repository/public
aliyunGoogle=https://maven.aliyun.com/repository/google
aliyunGradlePlugin=https://maven.aliyun.com/repository/gradle-plugin

# Disable downloading Gradle sources and docs to avoid network issues
org.gradle.dependency.verification.mode=off
org.gradle.caching=true
